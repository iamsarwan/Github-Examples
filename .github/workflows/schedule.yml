name: schedule

# Run every 5 minutes (UTC). GitHub scheduler is more reliable with */5 than very high-frequency schedules.
on:
  schedule:
    - cron: '*/5 * * * *'
  # Add manual trigger so you can test immediately from the Actions UI
  workflow_dispatch:

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Echo current time
        run: echo "The current server time is $(date)"